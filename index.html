<!DOCTYPE html>
<html lang="fr">
    <head>
        <title>Julia's Bistro - Cat Challenge</title>
        <meta charset='utf-8'/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Liaison vers ta feuille de style V11 corrigée -->
        <link rel="stylesheet" href="style-v11.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Sarina&display=swap" rel="stylesheet">
        <!-- Liaison vers ton script V9 optimisé -->
        <script type="text/javascript" src="game-v9.js" defer></script>
    </head>
    <body>
        
        <!-- ÉCRAN D'ACCUEIL -->
        <div id="StartScreen">
            <div class="start-box">
                <h2>Julia's Bistrot 🐾</h2>
                <p>Bienvenue ! Aide notre petit chat à préparer ses commandes favorites avant la fin du temps imparti !</p>
                <button id="StartBtn">Commencer</button>
            </div>
        </div>

        <!-- TABLEAU DES SCORES FINAL (GAME OVER) -->
        <div id="EndScreen" style="display: none;">
            <div class="end-box">
                <h2>Bistrot Fermé ! 🐾</h2>
                <div class="score-summary">
                    <div class="score-title">Score Final</div>
                    <div id="FinalScoreVal">0</div>
                    <div id="RecordLabel" class="high-score-label">Meilleur Score : 0</div>
                </div>
                <button id="PlayAgainBtn">Rejouer</button>
            </div>
        </div>

        <!-- ZONE DE JEU -->
        <div class="game-wrapper">
            
            <!-- Ardoise de score suspendue -->
            <div id="ScoreCard">
                <span class="label">SCORE</span>
                <span id="ScoreVal">0</span>
            </div>

            <h1 id="GameTitle">Julia's Bistrot</h1>

            <div id="Customer">
                <!-- Chat géant ancré (bas du corps masqué par le comptoir) -->
                <img id="CatCharacter" src="Cat/Idle/Idle_0.png" alt="Customer Cat">

                <!-- Bulle de commande cartoon surélevée -->
                <img id="CustomerChoice" src="Food/Apple.png" alt="Customer choice"/>
            </div>

            <!-- Comptoir en bois -->
            <div id="ActionContainer">
                <p id="Result">Préparez la commande !</p>
                
                <!-- Miniteur avec capsule de vies intégrée -->
                <div id="TimerBar">
                    <div id="Hearts">❤❤❤</div>
                    <div id="FillBar"></div>
                </div>

                <!-- Grille d'ingrédients -->
                <div id="ButtonsContainer">
                    <button id="Juice"><span>Juice</span></button>
                    <button id="Apple"><span>Apple</span></button>
                    <button id="Donut"><span>Donut</span></button>
                    <button id="Jelly"><span>Jelly</span></button>
                    <button id="Grape"><span>Grape</span></button>
                    <button id="IceCream"><span>Ice Cream</span></button>
                    <button id="Mango"><span>Mango</span></button>
                    <button id="Orange"><span>Orange</span></button>
                    <button id="Watermelon"><span>Watermelon</span></button>
                </div>
            </div>
        </div>
    </body>
</html>
